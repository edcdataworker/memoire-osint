services:
  ner:
    build: .
    image: memoire-osint-bloc4:local
    ports:
      - "127.0.0.1:18767:8764"
    volumes:
      - type: bind
        source: ${OSINT_ARTIFACTS:?Définir le dossier absolu des artefacts autorisés}
        target: /artifacts
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8764/health',timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 3
