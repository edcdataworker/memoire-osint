name: Portable code checks and local delivery
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python scripts/prepare_ci_demo.py
      - run: docker build -t memoire-osint-bloc4:local .
      - run: python scripts/test_docker.py --artifacts .state --output Preuves/ci_docker.json
      - run: python scripts/ci_local.py --persistent --port 8766
      - run: python -m osint_ner.deployment status --state .state/service
      - name: Stop the synthetic runner service
        if: always()
        run: python -m osint_ner.deployment stop --state .state/service
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthetic-serving-evidence
          path: Preuves/ci_*
          retention-days: 30
# Executes only synthetic data in an ephemeral runner, never the private TASS model.
