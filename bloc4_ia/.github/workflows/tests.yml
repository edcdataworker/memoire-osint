name: Portable code checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q
      - run: python -m build --wheel --no-isolation
# Prepared, not executed on GitHub. Local data and secrets are never uploaded.
# Real local deployment is scripts/ci_local.py with authorized local artifacts.
