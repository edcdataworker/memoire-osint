#cloud-config
{
  "package_update": true,
  "packages": [
    "docker.io",
    "docker-compose-v2",
    "ca-certificates"
  ],
  "runcmd": [
    [
      "systemctl",
      "enable",
      "--now",
      "docker"
    ]
  ],
  "write_files": [
    {
      "path": "/etc/memoire-osint-host",
      "content": "Bloc 2 : serveur local dédié. Aucun corpus ni secret transféré.\n"
    }
  ]
}
