name: Verification du memoire OSINT

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    name: Architecture code et configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bloc2_architecture
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app scripts tests
      - run: python -m compileall -q app scripts tests
      - run: python -m unittest discover -s tests -p virtual_server.py
      - run: python scripts/virtual_server.py plan
      - run: docker compose --profile search --profile ops config --quiet

  pipeline:
    name: Pipeline reprise et qualite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bloc3_pipeline
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.13.3
      - run: python -m ruff check pipeline tests scripts
      - run: python tests/integration.py
      - run: python -m unittest discover -s tests -p collection.py
      - run: python -m unittest discover -s tests -p closure.py
      - run: python -m unittest discover -s tests -p continuous.py
      - run: node --test tests/frontend_recovery.cjs

  ia:
    name: IA tests build et deploiement ephemere
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    defaults:
      run:
        working-directory: bloc4_ia
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bloc4_ia/requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python scripts/prepare_ci_demo.py
      - run: docker build -t memoire-osint-bloc4:local .
      - run: python scripts/test_docker.py --artifacts .state --output Preuves/ci_docker.json
      - run: python scripts/ci_local.py --persistent --port 8766
      - run: python -m osint_ner.deployment status --state .state/service
      - name: Stop the synthetic IA service
        if: always()
        run: python -m osint_ner.deployment stop --state .state/service
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: preuves-ci-ia
          path: bloc4_ia/Preuves/ci_*
          retention-days: 30
